# XC front panel (4-digit 7-segment)
panel = auto          # auto | fd650 (XCONN, GPIOA_15/14) | tm1637 (GT Combo, GPIOAO_2/3)
brightness = 4        # 1..7 (the GUI plugin setting overrides this)
scroll_step = 0.5     # seconds per character when scrolling long text
word_hold = 0.9       # seconds per word in word-by-word mode
scroll_hold = 1.0     # pause at the start/end of a scroll
scroll_mode = once    # once: scroll then rest on the first 4 chars | loop: keep scrolling
clock_colon = 0       # 1: blink the dot of digit 2 as a clock colon (test on hardware first)
