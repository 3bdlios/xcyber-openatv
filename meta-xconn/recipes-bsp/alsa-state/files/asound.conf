# Every ordinary ALSA client (GStreamer/IPTV, IPAudio, aplay...) goes through the
# XC software volume, which xc-volume-bridge keeps equal to the Enigma2 volume/mute.
pcm.!default {
    type plug
    slave.pcm "xc_softvol"
}

ctl.mixer0 {
    type hw
    card 0
}

# 64 raw steps of 1 dB: raw = 63 - Enigma2 attenuation (0 = -63 dB, 63 = 0 dB).
pcm.xc_softvol {
    type softvol
    slave.pcm "xc_hdmi_shared"
    control { name "XC Master" card 0 }
    min_dB -63.0
    max_dB 0.0
    resolution 64
}

# XC standard DVB audio, hardware HDMI endpoint shared through ALSA.
pcm.xc_hdmi_shared {
 type dmix
 ipc_key 584331
 slave { pcm "hw:0,2" rate 48000 channels 2 period_size 960 buffer_size 3840 }
}
# xc-audiod (DVB) applies the Enigma2 volume itself; it bypasses the software volume.
pcm.xc_native { type plug slave.pcm "hw:0,2" }

# XC HDMI is hardware device 2 when a client specifies only a card.
defaults.pcm.device 2
