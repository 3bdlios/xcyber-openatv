# XC removable-media machine. No Android eMMC flashing hooks.
MACHINE_NAME = "X-CYBER"
MACHINE_BRAND = "XCONN"
BRAND_OEM = "xconn"
SOC_FAMILY = "meson64"
TARGET_ARCH = "aarch64"
require conf/machine/include/arm/armv8-2a/tune-cortexa55.inc
require conf/machine/box-hardware.inc
MACHINE_FEATURES = "usbhost vfat ext2 alsa HDMI fb screen skins1080"
SERIAL_CONSOLES = "115200;ttyAML0"
KERNEL_IMAGETYPE = "Image"
PREFERRED_PROVIDER_virtual/kernel = "xc-hardware"
MACHINE_ESSENTIAL_EXTRA_RDEPENDS = "xc-hardware xc-gui-startup"
MACHINE_EXTRA_RRECOMMENDS = ""
IMAGE_FSTYPES = "tar.gz ext4"
IMAGE_ROOTFS_SIZE = "786432"
IMAGE_ROOTFS_EXTRA_SPACE = "131072"
IMAGEDIR = "xconn"
ROOTFS_FILE = "rootfs.tar.gz"
KERNEL_FILE = "kernel.img"
MTD_ROOTFS = ""
MTD_KERNEL = ""
MTD_BLACK = "mmcblk0 mmcblk1"
RCNAME = "dmm0"

PREFERRED_VERSION_xc-hardware = "5.15.196"

# Date of the verified XC kernel module bundle shipped in xc-hardware (hardware.tar.gz); shown as "Drivers" in About.
XC_DRIVERSDATE = "20261113"

